apiVersion: v1
kind: ServiceAccount
metadata:
  name: tasky
  namespace: wiz-exercise
  labels:
    app: tasky
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tasky-cluster-admin
  labels:
    app: tasky
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: tasky
    namespace: wiz-exercise
