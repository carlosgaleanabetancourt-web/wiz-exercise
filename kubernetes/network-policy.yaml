apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: wiz-exercise
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tasky-ingress
  namespace: wiz-exercise
spec:
  podSelector:
    matchLabels:
      app: tasky
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tasky-egress
  namespace: wiz-exercise
spec:
  podSelector:
    matchLabels:
      app: tasky
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
    - ports:
        - port: 27017
          protocol: TCP
      to:
        - ipBlock:
            cidr: 10.0.0.0/16
    - ports:
        - port: 443
          protocol: TCP
